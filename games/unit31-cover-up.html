var TERMS = [
  {t:"ground covers", d:["Low-growing plants that cover the ground in place of turf","Plants used instead of grass on steep, rocky, or shady sites"], pg:"p. 377"},
  {t:"functionally", d:["Used for a job, like filling bare spots and preventing erosion","Describes ground covers used for a purpose instead of only for looks"], pg:"p. 377"},
  {t:"erosion", d:["Soil wearing or washing away, a big problem on steep banks","What ground covers help prevent on steep banks"], pg:"p. 377"},
  {t:"broadleaf evergreen ground covers", d:["The type that keeps its leaves year-round","Pachysandra and wintercreeper are this type"], pg:"p. 377"},
  {t:"deciduous ground covers", d:["The type that loses its leaves during fall and winter","A ground cover like Hosta that dies to the ground in fall"], pg:"p. 377"},
  {t:"narrowleaf evergreen ground covers", d:["The type with needlelike or scalelike leaves that keeps its color","Creeping junipers and spreading yew are this type"], pg:"p. 377"},
  {t:"locality", d:["The area where a plant will grow; a selection question asks if a plant is suitable for it","The textbook asks: is the plant suitable for the ___?"], pg:"p. 377"},
  {t:"prostrate", d:["Lying flat along the ground, like the juniper suggested for a sunny bank","Growing flat and low; the text suggests this kind of juniper for sunny banks"], pg:"p. 377"},
  {t:"decomposed", d:["Broken down by decay, like the leaves used as a mulch","Leaves that have rotted and broken down are this"], pg:"p. 383"},
  {t:"perimeter", d:["The outer edge of a planting, cut back when pruning","Pruning confines a planting by cutting back this outer edge"], pg:"p. 383"}
];

var JOBS = [
  {site:"Under big oaks with dense shade. Client says slow growth is fine.", tags:["dense shade","slow OK"], L:"shade", a:"Partridgeberry", o:["Maiden pink","Sunrose","Blue rug juniper"], why:"Partridgeberry's remarks: tolerant of dense shade and slow growing. The others need sun.", pg:"Figure 31-1, p. 380"},
  {site:"Sunny, dry spot by the mailbox. Wants evergreen foliage and flowers in June to July.", tags:["full sun","dry soil","June to July"], L:"sun", a:"Sunrose", o:["Wild ginger","Wintergreen","Lily-of-the-valley"], why:"Sunrose: full sun, evergreen, flowers June to July, does best in dry soil.", pg:"Figure 31-1, p. 380"},
  {site:"Client is laying out a formal knot garden around an herb bed.", tags:["formal","knot garden"], L:"sun", a:"Germander", o:["Moneywort","Plantain lily","Bugleweed"], why:"Germander's remark is \"knot garden.\"", pg:"Figure 31-1, p. 380"},
  {site:"Shady walkway. Client wants leaves that smell good when brushed.", tags:["shade","scented leaves"], L:"shade", a:"Sweet woodruff", o:["Maiden pink","Rockcress","Crown vetch"], why:"Sweet woodruff: shade, scented leaves in whorls of six to eight.", pg:"Figure 31-1, p. 378"},
  {site:"Steep, sunny bank. Client wants the shortest juniper you carry, 6 inches or less.", tags:["full sun","steep bank","6 in. max"], L:"sun", a:"Blue rug juniper ('Wiltoni')", o:["Creeping juniper","Waukegan juniper ('Douglasii')","Spreading English yew"], why:"Blue rug is 4\" to 6\". Creeping and Waukegan are 12\" to 18\"; the yew is 36\".", pg:"Figure 31-1, p. 380"},
  {site:"Heavy shade by the front door. Client wants fragrant white flowers in mid-spring.", tags:["heavy shade","fragrant"], L:"shade", a:"Sarcococca", o:["Heather","Evergreen candytuft","Germander"], why:"Sarcococca: fragrant white flowers mid-spring, light to heavy shade.", pg:"Figure 31-1, p. 380"},
  {site:"Sun or shade either way. Client wants bright blue flowers in summer.", tags:["sun or shade","blue","summer"], L:"any", a:"Plumbago", o:["Bugleweed","Periwinkle","Golden star chrysogonum"], why:"Plumbago: blue summer flowers, shade or sun, remark \"electric blue.\" Bugleweed and periwinkle bloom in spring.", pg:"Figure 31-1, p. 378"},
  {site:"Full sun, well-drained acid soil. Wants red to pink flowers May to June, only 2 to 6 inches tall.", tags:["full sun","acid soil","2 to 6 in."], L:"sun", a:"Maiden pink", o:["Heath","Wild ginger","Partridgeberry"], why:"Maiden pink: 2\" to 6\", full sun, red to pink May to June, needs well-drained acid soil.", pg:"Figure 31-1, p. 378"},
  {site:"Sunny front yard. Client wanted spreading English yew but the price is too high.", tags:["full sun","evergreen","budget"], L:"sun", a:"Bar Harbor juniper", o:["Spreading English yew","Japanese spurge (Pachysandra)","Plantain lily (Hosta)"], why:"Junipers are full sun evergreens. The yew is marked expensive, Pachysandra needs shade, and Hosta dies to the ground in fall (Review Question 5).", pg:"Figure 31-1, pp. 378 to 380"},
  {site:"Shady bed in front of evergreen shrubs. Client wants a dark green, leafy carpet.", tags:["shade","with evergreens"], L:"shade", a:"Japanese spurge (Pachysandra)", o:["Stonecrop (Sedum)","Sunrose","Heather"], why:"Pachysandra: shade, dark green leafy foliage, remark \"excellent with evergreens.\" The others need sun.", pg:"Figure 31-1, p. 379"},
  {site:"Sun to part shade. Client loves silver-edged leaves and yellow May flowers.", tags:["part shade","silver edge"], L:"any", a:"Yellow archangel", o:["Moneywort","Golden star chrysogonum","Creeping mahonia"], why:"Yellow archangel (Lamiastrum): yellow in May, sun to part shade, silver-edged foliage.", pg:"Figure 31-1, p. 379"},
  {site:"Shady side yard. Client is fine with it going bare in winter but wants variegated leaves and lavender August flowers.", tags:["shade","variegated","bare in winter OK"], L:"shade", a:"Plantain lily (Hosta)", o:["Japanese spurge (Pachysandra)","Wintergreen","Partridgeberry"], why:"Hosta: lavender August flowers, dense variegated leaves, dies to ground in fall (deciduous).", pg:"Figure 31-1, p. 378"},
  {site:"Sunny slope. Client wants tough, leathery, spiny leaves like holly.", tags:["sun","holly-like"], L:"sun", a:"Creeping mahonia", o:["Golden star chrysogonum","Sunrose","Bearberry"], why:"Creeping mahonia: sun, dull bluish green leathery and spiny leaves like holly.", pg:"Figure 31-1, p. 380"},
  {site:"Hot, dry bed in full sun. Client wants evergreen leaves and the newest varieties.", tags:["full sun","dry area"], L:"sun", a:"Stonecrop (Sedum)", o:["Wild ginger","Lily-of-the-valley","Wintergreen"], why:"Sedum: full sun, evergreen, good for dry areas, excellent new varieties. The others need shade.", pg:"Figure 31-1, p. 379"},
  {site:"Georgia job: sunny bed. Client asked for English ivy, but you want a Georgia native with bright yellow May to June flowers.", tags:["full sun","native","Georgia"], L:"sun", a:"Golden star chrysogonum", o:["English ivy","Crown vetch","Periwinkle"], why:"Golden star (Chrysogonum virginianum) is a native with yellow May to June flowers. English ivy, crown vetch, and periwinkle are on Georgia's invasive plant list.", pg:"Guided notes Georgia Check; Figure 31-1, p. 378"}
];

var CALLS = [
  {q:"\"When should I fertilize my established ground cover?\"", a:"Early spring, and only as needed", o:["Every month all summer","Late fall before frost","Every time I water"], why:"After planting, fertilize only as needed, in early spring.", pg:"p. 383"},
  {q:"\"What are the two ways to put out that fertilizer?\"", a:"Dry granular watered in, or soluble run through a hose and sprinkler", o:["Spray it on the leaves only","Bury fertilizer spikes by each plant","Mix it into the mulch"], why:"Use a dry granular fertilizer watered in, or a soluble fertilizer siphoned through a garden hose and sprinkler.", pg:"p. 383"},
  {q:"\"How deep should I dig in the fertilizer and organic matter?\"", a:"Into the top 6 inches", o:["The top 2 inches","The top 12 inches","The top 18 inches"], why:"Dig the materials into the top 6 inches of soil before planting.", pg:"p. 381"},
  {q:"\"My site is a very steep slope. Should I till it first?\"", a:"No. Add topsoil if needed, but don't till", o:["Yes, till 6 inches deep","Yes, and dig in peat moss","Only till the top half"], why:"On a very steep slope, little can be done except add topsoil. No tilling or digging in organic matter.", pg:"p. 381"},
  {q:"\"How much 5-10-5 do I spread on each 100 square feet?\"", a:"2 to 5 pounds", o:["10 to 15 pounds","Half a pound","25 pounds"], why:"Use 2 to 5 lb of 5-10-5 (or cottonseed meal) per 100 sq ft.", pg:"p. 381"},
  {q:"\"Why mulch between my new plants?\"", a:"Weed control and moisture retention", o:["It makes plants bloom sooner","It keeps the ground cover from spreading","It replaces fertilizer"], why:"Mulch between newly placed plants aids weed control and moisture retention until the ground cover fills in.", pg:"p. 383"},
  {q:"\"Is it quicker to mulch before or after planting?\"", a:"Before: cover the area, then pull mulch back around each plant", o:["After every plant is in","Only after the first year","Mulch is not needed"], why:"Covering the whole surface before planting is less time-consuming. Push it aside, plant, pull it back.", pg:"p. 383"},
  {q:"\"Which of these is NOT a mulch the textbook lists for ground covers?\"", a:"Gravel", o:["Pine needles","Well-rotted sawdust","Decomposed leaves"], why:"Listed mulches: pine bark, hardwood bark, pine needles, well-rotted sawdust, peat moss, decomposed leaves.", pg:"p. 383"},
  {q:"\"When do I need to prune my ground cover?\"", a:"Only to keep it confined to its area", o:["Every two weeks","Before every rain","Only in winter"], why:"Pruning is necessary only to confine the planting to the area where it is wanted.", pg:"p. 383"},
  {q:"\"How is that pruning usually done?\"", a:"Mow around the edges or cut back the outer perimeter", o:["Shear the whole bed to 1 inch","Pull out every other plant","Burn the old growth"], why:"Usually done by mowing around the edges or cutting back the outer perimeter (edge).", pg:"p. 383"},
  {q:"\"It's the first summer and my plants are wilting. How much water?\"", a:"At least 1 inch to the entire planting area", o:["A cup per plant","At least 4 inches","Just mist the leaves"], why:"Any time soil is dry or plants wilt in the first year, apply at least 1 inch of water to the entire area.", pg:"p. 383"},
  {q:"\"Do I keep watering after the first year?\"", a:"Not if the proper plants were selected", o:["Yes, every day","Yes, 1 inch every week forever","Only in winter"], why:"If the proper plants are selected, watering should not be necessary after the first year.", pg:"p. 383"},
  {q:"\"I see bugs on my ground cover! What do I do first?\"", a:"Identify the insect or disease", o:["Spray any pesticide right away","Pull up the whole bed","Add more fertilizer"], why:"If control becomes necessary, first identify the insect or disease, then spray a recommended pesticide.", pg:"p. 383"},
  {q:"\"What should I wear when I spray?\"", a:"The protective clothing the pesticide label requires", o:["Whatever is comfortable","Shorts and sandals if it is hot","Nothing special for small jobs"], why:"Use protective clothing as required by the pesticide container label.", pg:"p. 383"},
  {q:"\"My steep slope needs to be covered fast. How should we space plants?\"", a:"Closer together", o:["Farther apart","Only one row at the top","It doesn't matter"], why:"On steep slopes the area may need to be covered quickly, so place plants closer together.", pg:"p. 383"},
  {q:"\"Why would you space plants farther apart on my level yard?\"", a:"It lowers the original plant cost", o:["They grow in faster","It prevents all weeds","Plants need no water then"], why:"Wider spacing on level areas reduces original plant costs, but it takes longer to cover.", pg:"p. 383"}
];

/* ===== Helpers ===== */
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a,n){return shuffle(a).slice(0,n)}
function rint(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function money(n){return (n<0?"-$":"$")+Math.abs(n).toLocaleString("en-US")}
function store(k,v){try{if(v===undefined){return localStorage.getItem(k)}localStorage.setItem(k,v)}catch(e){return null}}
function normName(s){return String(s||"").trim().toLowerCase().replace(/\s+/g," ")}
function pad(n){return (n<10?"0":"")+n}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fnv(str,seed){var h=seed>>>0;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
var ALPHA="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function makeCode(name,period,pct,date,mins){
  var s=SALT+"|"+normName(name)+"|"+String(period||"").trim().toLowerCase()+"|"+parseInt(pct,10)+"|"+date+"|"+parseInt(mins,10);
  var h1=fnv(s,2166136261),h2=fnv(s+"#",h1^0x9e3779b9),out="";
  for(var i=0;i<3;i++){out+=ALPHA[h1%ALPHA.length];h1=Math.floor(h1/ALPHA.length)}
  out+="-";
  for(var j=0;j<3;j++){out+=ALPHA[h2%ALPHA.length];h2=Math.floor(h2/ALPHA.length)}
  return out;
}

/* ===== Game state ===== */
var G=null;
var TOPICS=[
  {key:"terms",name:"Key terms",ref:"pp. 376 to 383"},
  {key:"jobs",name:"Selection and Figure 31-1",ref:"pp. 377 to 380"},
  {key:"math",name:"Planting math",ref:"pp. 381, 383"},
  {key:"calls",name:"Care: fertilizer, mulch, pruning, water, pests",ref:"pp. 381, 383"}
];

var STATIONS=[
  {id:"shed",name:"Tool Shed",icon:"🛠️",desc:"Learn the crew's words before you dig.",plan:["T","T","T"]},
  {id:"north",name:"North Wall",icon:"🏛️",desc:"Continuous shade on the north side of the building.",plan:["Js","Js","T"]},

  {id:"patio",name:"Patio Beds",icon:"🧮",desc:"Measure and figure the planting order.",plan:["M","M","C"]},

];

function termItem(t){var others=shuffle(TERMS.filter(function(x){return x.t!==t.t})).slice(0,3).map(function(x){return x.t});
  return {topic:0,type:"mc",prompt:t.d[rint(0,t.d.length-1)],ask:"Which key term fits?",a:t.t,opts:shuffle([t.t].concat(others)),why:"\""+t.t+"\": "+t.d[0]+".",pg:t.pg}}
function jobItem(j){return {topic:1,type:"mc",site:j,prompt:j.site,ask:"Which plant is the one best fit?",a:j.a,opts:shuffle([j.a].concat(j.o)),why:j.why,pg:j.pg}}
function callItem(c){return {topic:3,type:"mc",prompt:c.q,ask:"What do you tell them?",a:c.a,opts:shuffle([c.a].concat(c.o)),why:c.why,pg:c.pg}}

function buildStations(){
  var terms=shuffle(TERMS),calls=shuffle(CALLS),maths=shuffle(["area","fert","cotton","plants","water"]);
  var shade=shuffle(JOBS.filter(function(j){return j.L==="shade"})),sun=shuffle(JOBS.filter(function(j){return j.L==="sun"}));
  var used={};
  function take(pool){for(var i=0;i<pool.length;i++){if(!used[pool[i].a+pool[i].site]){used[pool[i].a+pool[i].site]=1;return pool[i]}}return null}
  var out=STATIONS.map(function(st){return {st:st,items:[],done:false,right:0,step:0}});
  // pass 1: everything but Ja
  out.forEach(function(o){o.st.plan.forEach(function(p,ix){var it=null;
    if(p==="T")it=termItem(terms.pop());else if(p==="C")it=callItem(calls.pop());else if(p==="M")it=mathItem(maths.pop());

    o.items[ix]=it})});
  // pass 2: any-light jobs from what is left
  var rest=shuffle(JOBS.filter(function(j){return j.L==="any"&&!used[j.a+j.site]}));
  out.forEach(function(o){o.st.plan.forEach(function(p,ix){if(p==="Ja")o.items[ix]=jobItem(take(rest))})});
  return out;
}
function mathItem(kind){
  var L,W,A,rate,ans,prompt,unit,why;
  if(kind==="plants"){var sp=rint(1,2);L=rint(4,12)*2;W=rint(3,8)*2;A=L*W;ans=A/(sp*sp);
    prompt="Level bed: "+L+" ft by "+W+" ft. Plants go "+(sp===1?"12 inches (1 ft)":"2 ft")+" apart, so each plant covers "+(sp*sp)+" sq ft. How many plants?";unit="plants";
    why=L+" x "+W+" = "+A+" sq ft. "+A+" / "+(sp*sp)+" = "+ans+" plants. Spacing depends on size, growth rate, and time allowed to spread.";
    return {topic:2,type:"num",prompt:prompt,a:ans,tol:0,unit:unit,why:why,pg:"pp. 381, 383"};}
  L=rint(8,24);W=rint(5,16);A=L*W;
  if(kind==="area"){return {topic:2,type:"num",prompt:"The bed is "+L+" ft by "+W+" ft. What is the area?",a:A,tol:0,unit:"sq ft",why:L+" x "+W+" = "+A+" sq ft. You need the area before you can figure fertilizer or plants.",pg:"p. 381"};}
  if(kind==="fert"||kind==="cotton"){rate=rint(2,5);ans=Math.round(A/100*rate*10)/10;
    var prod=kind==="fert"?"5-10-5 fertilizer":"cottonseed meal";
    return {topic:2,type:"num",prompt:"Tillable bed: "+L+" ft by "+W+" ft. Spread "+rate+" lb of "+prod+" per 100 sq ft. How many pounds? (one decimal is fine)",a:ans,tol:0.15,unit:"lb",
      why:L+" x "+W+" = "+A+" sq ft. "+A+" / 100 x "+rate+" = "+ans+" lb. The text allows 2 to 5 lb per 100 sq ft.",pg:"p. 381"};}
  ans=Math.round(A*0.62);
  return {topic:2,type:"num",prompt:"First-year watering: the bed is "+L+" ft by "+W+" ft and needs 1 inch of water. One inch on 1 sq ft is about 0.62 gallon. About how many gallons? (whole number)",a:ans,tol:Math.max(2,Math.round(ans*0.02)),unit:"gallons",
    why:L+" x "+W+" = "+A+" sq ft. "+A+" x 0.62 = about "+ans+" gallons. Apply at least 1 inch when soil is dry or plants wilt in the first year.",pg:"p. 383"};
}

/* ===== Screens ===== */
function totals(){var n=0,c=0,a=0;G.stations.forEach(function(s){n+=s.items.length;c+=s.right;a+=s.step});return {n:n,c:c,a:a}}
function setStats(){
  if(!G){$("stats").innerHTML="";return}
  var t=totals(),cov=G.stations.filter(function(s){return s.done}).length;
  $("stats").innerHTML='<div>Soil saved<b>'+G.soil+' t</b></div><div>Covered<b>'+cov+'/'+G.stations.length+'</b></div><div>Correct<b>'+t.c+'/'+t.a+'</b></div>';
}
function startScreen(){
  G=null;setStats();
  var best=store("u31cover_best"),bestTxt="";
  try{if(best){var b=JSON.parse(best);bestTxt='<p class="small muted">Best on this device: <b>'+esc(b.pct)+'%</b> by '+esc(b.name)+' ('+esc(b.date)+')</p>'}}catch(e){}
  $("app").innerHTML='<div class="card"><div class="kicker">Unit 31 &bull; Ground Covers</div><h1>Campus Cover-Up</h1>'+
  '<p>Our campus has seven bare, eroding, or shady spots where grass will not grow. Visit each station on the map, answer its three challenges, and cover the ground. Every right answer saves soil. Every miss lets some wash away. All answers come from your textbook, pages 376 to 385.</p>'+
  '<div class="rounds"><div><b>Pick any station</b>Work the map in any order.</div><div><b>3 challenges each</b>Terms, plant picks, math, and care calls.</div><div><b>Save the soil</b>+'+SOIL_OK+' tons right, -'+SOIL_BAD+' ton wrong.</div></div>'+
  '<div class="row"><div><label for="fn">First name</label><input type="text" id="fn" autocomplete="given-name" maxlength="30"></div><div><label for="ln">Last name</label><input type="text" id="ln" autocomplete="family-name" maxlength="30"></div></div>'+
  '<label for="per">Class period</label><select id="per"><option value="">Choose your period</option>'+[1,2,3,4,5,6,7,8].map(function(p){return '<option>'+p+'</option>'}).join("")+'</select>'+
  '<p class="err" id="err"></p><button class="btn" id="go">Head out to the map</button>'+bestTxt+
  '<p style="margin-top:18px"><button class="linkbtn" id="tchk">Teacher check</button></p></div>';
  $("go").onclick=function(){
    var fn=$("fn").value.trim(),ln=$("ln").value.trim(),per=$("per").value;
    if(!fn||!ln){$("err").textContent="Enter your first and last name.";return}
    if(!per){$("err").textContent="Choose your class period.";return}
    G={name:fn+" "+ln,period:per,stations:buildStations(),cur:-1,soil:0,start:Date.now(),topicRight:[0,0,0,0],topicTot:[0,0,0,0]};
    G.stations.forEach(function(s){s.items.forEach(function(it){G.topicTot[it.topic]++})});
    mapScreen();
  };
  $("tchk").onclick=teacherScreen;
}
function mapScreen(){
  G.cur=-1;setStats();
  var left=G.stations.filter(function(s){return !s.done}).length;
  if(left===0)return finish();
  var h='<div class="card"><div class="kicker">Campus map</div><h2>'+(left===G.stations.length?"Where do you want to start?":left+" spot"+(left>1?"s":"")+" still bare")+'</h2>'+
  '<div class="soilbar" aria-label="Soil saved"><div style="width:'+Math.max(0,Math.min(100,100*G.soil/(totals().n*SOIL_OK)))+'%"></div></div>'+
  '<div class="map">';
  G.stations.forEach(function(s,ix){
    var cls=s.done?(s.right===3?"plot full":"plot done"):(s.step>0?"plot started":"plot");
    var status=s.done?("Covered &bull; "+s.right+"/3"):(s.step>0?"In progress":"Bare soil");
    h+='<button class="'+cls+'" data-ix="'+ix+'"'+(s.done?" disabled":"")+'><span class="ic" aria-hidden="true">'+s.st.icon+'</span><b>'+esc(s.st.name)+'</b><span class="ds">'+esc(s.st.desc)+'</span><span class="st">'+status+'</span></button>';
  });
  h+='</div></div>';
  $("app").innerHTML=h;window.scrollTo(0,0);
  Array.prototype.forEach.call(document.querySelectorAll(".plot"),function(b){b.onclick=function(){G.cur=+b.getAttribute("data-ix");showItem()}});
}
function showItem(){
  setStats();
  var S=G.stations[G.cur],it=S.items[S.step];
  var h='<div class="card"><div class="kicker">'+S.st.icon+' '+esc(S.st.name)+' &bull; Challenge '+(S.step+1)+' of 3</div><div class="progress"><div style="width:'+(100*S.step/3)+'%"></div></div>';
  if(it.site){h+='<div class="site"><b>Work order:</b> '+esc(it.prompt)+'<div class="tags">'+it.site.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("")+'</div></div><h2>'+esc(it.ask)+'</h2>'}
  else if(it.type==="num"){h+='<div class="site"><b>Planting order:</b> '+esc(it.prompt)+'</div>'}
  else{h+='<h2>'+esc(it.prompt)+'</h2><p class="muted">'+esc(it.ask)+'</p>'}
  if(it.type==="mc"){h+='<div class="opts">'+it.opts.map(function(o,ix){return '<button class="opt" data-ix="'+ix+'">'+esc(o)+'</button>'}).join("")+'</div>'}
  else{h+='<div class="mathbox"><input type="number" step="any" inputmode="decimal" id="num" aria-label="Your answer"><span class="unit">'+esc(it.unit)+'</span><button class="btn alt" id="sub">Check</button></div>'}
  h+='<div class="fb" id="fb"></div></div>';
  $("app").innerHTML=h;window.scrollTo(0,0);
  if(it.type==="mc"){Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){b.onclick=function(){answer(it.opts[+b.getAttribute("data-ix")],b)}})}
  else{var inp=$("num");inp.focus();$("sub").onclick=function(){if(inp.value.trim()===""){inp.focus();return}answer(parseFloat(inp.value),null)};inp.onkeydown=function(e){if(e.key==="Enter")$("sub").click()}}
}
function answer(val,btn){
  var S=G.stations[G.cur],it=S.items[S.step],ok;
  ok=it.type==="mc"?val===it.a:Math.abs(val-it.a)<=it.tol+1e-9;
  if(ok){S.right++;G.topicRight[it.topic]++;G.soil+=SOIL_OK}else{G.soil-=SOIL_BAD}
  S.step++;
  if(it.type==="mc"){Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){b.disabled=true;var o=it.opts[+b.getAttribute("data-ix")];if(o===it.a)b.classList.add("right");else if(b===btn)b.classList.add("wrong")})}
  else{$("num").disabled=true;$("sub").disabled=true}
  var last=S.step>=3;if(last)S.done=true;
  var fb=$("fb");fb.className="fb show "+(ok?"good":"bad");
  fb.innerHTML='<b>'+(ok?"Ground covered! +"+SOIL_OK+" tons of soil saved.":"Washout. -"+SOIL_BAD+" ton of soil lost.")+'</b><br>'+(ok?"":"Answer: <b>"+esc(it.a)+(it.unit?" "+esc(it.unit):"")+"</b>. ")+esc(it.why)+'<div class="pg">'+esc(it.pg)+'</div><p style="margin:10px 0 0"><button class="btn" id="nx">'+(last?"Back to the map":"Next challenge")+'</button></p>';
  setStats();$("nx").focus();
  $("nx").onclick=function(){if(last)mapScreen();else showItem()};
}
function finish(){
  var now=new Date(),mins=Math.max(1,Math.round((Date.now()-G.start)/60000)),t=totals(),pct=Math.round(100*t.c/t.n),date=ymd(now);
  var code=makeCode(G.name,G.period,pct,date,mins);
  var stars=pct>=90?5:pct>=80?4:pct>=70?3:pct>=60?2:1;
  var rank=["Bare Ground","Patchy Cover","Filling In","Solid Mat","Fully Covered Campus"][stars-1];
  var full=G.stations.filter(function(s){return s.right===3}).length;
  try{var prev=JSON.parse(store("u31cover_best")||"null");if(!prev||pct>prev.pct)store("u31cover_best",JSON.stringify({pct:pct,name:G.name,date:date}))}catch(e){}
  var rows=TOPICS.map(function(T,r){var tot=G.topicTot[r],c=G.topicRight[r];return '<tr><td>'+esc(T.name)+'</td><td>'+c+' / '+tot+'</td><td>'+(c===tot?'<span class="muted">Nice work</span>':'Review '+esc(T.ref))+'</td></tr>'}).join("");
  G.result={pct:pct,code:code,mins:mins};
  $("stats").innerHTML='<div>Soil saved<b>'+G.soil+' t</b></div>';
  $("app").innerHTML='<div id="certPrint"><div class="cert"><div class="kicker">North Paulding Ag &bull; Unit 31 Ground Covers</div><h1>Certificate of Completion</h1><p class="muted" style="margin:0">Campus Cover-Up</p>'+
  '<div class="name">'+esc(G.name)+'</div><div class="muted">Period '+esc(G.period)+'</div>'+
  '<div class="big">'+pct+'%</div><div class="stars">'+"★".repeat(stars)+'<span style="color:#D9C4A3">'+"★".repeat(5-stars)+'</span></div><div><b>'+rank+'</b></div>'+
  '<div class="certgrid"><div>Correct<b>'+t.c+' of '+t.n+'</b></div><div>Soil saved<b>'+G.soil+' tons</b></div><div>Spots fully covered<b>'+full+' of '+G.stations.length+'</b></div><div>Minutes played<b>'+mins+'</b></div><div>Completed<b>'+esc(date)+' '+pad(now.getHours())+':'+pad(now.getMinutes())+'</b></div></div>'+
  '<div class="small muted">Completion code</div><div class="code" id="code">'+code+'</div>'+
  '<table class="bd"><tr><th>Topic</th><th>Score</th><th>Next step</th></tr>'+rows+'</table></div></div>'+
  '<div class="row noprint" style="margin-top:16px"><button class="btn" id="pr">Print / Save as PDF</button><button class="btn ghost" id="again">Play again</button></div>';
  $("pr").onclick=function(){window.print()};
  $("again").onclick=startScreen;window.scrollTo(0,0);
}
function teacherScreen(){
  $("app").innerHTML='<div class="card"><div class="kicker">Teacher check</div><h2>Verify a completion code</h2><label for="pin">Teacher PIN</label><input type="text" id="pin" inputmode="numeric" autocomplete="off"><p class="err" id="perr"></p><button class="btn alt" id="pgo">Unlock</button> <button class="btn ghost" id="back">Back</button></div>';
  $("back").onclick=startScreen;
  $("pgo").onclick=function(){
    if($("pin").value.trim()!==TEACHER_PIN){$("perr").textContent="Incorrect PIN.";return}
    $("app").innerHTML='<div class="card"><div class="kicker">Teacher check</div><h2>Type what the certificate shows</h2>'+
    '<label for="tn">Student name (first and last)</label><input type="text" id="tn"><div class="row"><div><label for="tp">Period</label><input type="text" id="tp"></div><div><label for="tc">Percent</label><input type="number" id="tc"></div></div>'+
    '<div class="row"><div><label for="td">Date</label><input type="date" id="td" value="'+ymd(new Date())+'"></div><div><label for="tm">Minutes played</label><input type="number" id="tm"></div></div>'+
    '<label for="tk">Completion code</label><input type="text" id="tk" placeholder="XXX-XXX" autocapitalize="characters"><p style="margin-top:14px"><button class="btn alt" id="vgo">Check code</button> <button class="btn ghost" id="back2">Back</button></p><div id="vres"></div></div>';
    $("back2").onclick=startScreen;
    $("vgo").onclick=function(){
      var want=makeCode($("tn").value,$("tp").value,$("tc").value,$("td").value,$("tm").value);
      var got=$("tk").value.trim().toUpperCase().replace(/\s/g,"");if(got.length===6)got=got.slice(0,3)+"-"+got.slice(3);
      var ok=got===want;
      $("vres").innerHTML='<div class="match '+(ok?"yes":"no")+'">'+(ok?"Match. This certificate is valid.":"No match. Check each field, or the certificate was changed.")+'</div>';
    };
  };
}
startScreen();
</script>
