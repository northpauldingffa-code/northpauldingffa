<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landscape Company Tycoon | Unit 25 Annual Bedding Plants</title>
<!-- North Paulding FFA. Fully self-contained: no outside fonts, scripts, or images. -->
<style>
:root{
  --barn:#6B3226; --barn-d:#4f241b; --green:#3C6255; --green-d:#2c4a40; --tan:#D9C4A3; --cream:#F3ECE1;
  --ink:#2B2118; --muted:#6E6255; --ok:#2f7a4f; --bad:#a3342a; --gold:#C47A2C; --paper:#ffffff; --line:#e3d6c1;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#efe8dc;color:var(--ink);font-family:Calibri,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.45}
h1,h2,h3,.serif{font-family:Cambria,Georgia,"Times New Roman",serif}
button{font:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:16px}
/* HUD */
#hud{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#hud .wrap{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding:10px 16px}
#hud .co{font-family:Cambria,Georgia,serif;font-weight:700;font-size:18px;flex:1 1 220px}
#hud .stat{font-size:15px;white-space:nowrap}
#hud .stat b{font-size:18px}
#hud .stars{color:#f3c86b;letter-spacing:1px}
.progress{height:6px;background:rgba(255,255,255,.25)}
.progress i{display:block;height:100%;background:var(--tan);width:0;transition:width .3s}
/* cards */
.card{background:var(--paper);border-radius:12px;padding:22px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card.cream{background:var(--cream)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--green);text-transform:uppercase}
h1{font-size:34px;margin:4px 0 8px;color:var(--ink)}
h2{font-size:26px;margin:4px 0 10px;color:var(--barn)}
h3{font-size:20px;margin:0 0 6px;color:var(--barn)}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:inline-block;border:0;border-radius:8px;padding:11px 20px;background:var(--barn);color:#fff;font-weight:700}
.btn:hover{background:var(--barn-d)}
.btn.green{background:var(--green)} .btn.green:hover{background:var(--green-d)}
.btn.ghost{background:transparent;color:var(--green);border:2px solid var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.f{display:block;font-weight:700;margin:12px 0 4px}
input[type=text],input[type=number],input[type=password],select{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:#fff;width:100%;max-width:420px}
input:focus,select:focus{outline:none;border-color:var(--green)}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{text-align:left;background:var(--cream);border:2px solid transparent;border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt.right{background:#dcefe2;border-color:var(--ok)}
.opt.wrong{background:#f6dcd8;border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;display:none}
.fb.show{display:block}
.fb.good{background:#dcefe2;border-left:0}
.fb.bad{background:#f6dcd8}
.fb b.t{display:block;font-size:18px;margin-bottom:2px}
.client{display:flex;gap:14px;align-items:flex-start}
.avatar{flex:0 0 52px;height:52px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Cambria,Georgia,serif;font-weight:700;font-size:22px}
.bubble{background:var(--cream);border-radius:12px;padding:12px 14px;flex:1}
.pill{display:inline-block;background:var(--cream);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--green);font-weight:700;margin:2px 4px 2px 0}
/* match */
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:12px}
.match .col{display:grid;gap:8px;align-content:start}
.tile{background:var(--cream);border:2px solid transparent;border-radius:10px;padding:10px 12px;text-align:left;color:var(--ink)}
.tile.term{font-family:Cambria,Georgia,serif;font-weight:700;color:var(--barn)}
.tile.sel{border-color:var(--green);background:#e4eee9}
.tile.done{background:#dcefe2;border-color:var(--ok);opacity:.75;cursor:default}
.tile.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* order */
.order{display:grid;gap:8px;margin-top:12px}
.order .tile{display:flex;gap:10px;align-items:center}
.order .num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.placed{display:grid;gap:6px;margin-top:10px}
.placed div{background:#dcefe2;border-radius:8px;padding:8px 12px}
/* design */
.bed{display:grid;gap:10px;margin-top:12px}
.bedrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;background:var(--cream);border-radius:10px;padding:10px 12px}
.bedrow .lab{font-weight:700;color:var(--barn)}
.bedrow .lab span{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.checks{font-size:14px;margin-top:6px;grid-column:1/-1}
.checks span{display:inline-block;margin-right:12px}
.ok{color:var(--ok);font-weight:700} .no{color:var(--bad);font-weight:700}
/* baskets */
.basket-in{display:grid;grid-template-columns:repeat(3,minmax(0,160px));gap:12px;margin-top:8px}
.basket-in input{max-width:160px}
/* report */
table.rep{width:100%;border-collapse:collapse;margin-top:10px}
table.rep th,table.rep td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.rep th{background:var(--green);color:#fff;font-weight:700}
.bar{height:10px;background:var(--cream);border-radius:5px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--green)}
/* certificate */
#cert{border:6px double var(--barn);background:#fffdf8;text-align:center;padding:28px 22px}
#cert .big{font-family:Cambria,Georgia,serif;font-size:56px;font-weight:700;color:var(--green);line-height:1}
#cert .code{font-family:"Courier New",monospace;font-size:28px;font-weight:700;letter-spacing:.12em;background:var(--cream);display:inline-block;padding:6px 14px;border-radius:8px;margin-top:6px}
#cert .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
#cert .grid div{background:var(--cream);border-radius:8px;padding:8px}
#cert .grid b{display:block;font-size:20px;color:var(--barn)}
/* catalog */
.modal{position:fixed;inset:0;background:rgba(30,22,16,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:12px}
.modal[hidden]{display:none}
.modal .box{background:#fff;border-radius:12px;width:100%;max-width:1100px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:hidden}
.modal .head{background:var(--green);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.modal .head h3{color:#fff;margin:0;flex:1 1 240px}
.modal .tools{padding:10px 16px;display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.modal .tools input,.modal .tools select{max-width:280px}
.modal .scroll{overflow:auto;flex:1}
table.cat{border-collapse:collapse;width:100%;font-size:14px;min-width:820px}
table.cat th{position:sticky;top:0;background:var(--cream);color:var(--barn);text-align:left;padding:8px;z-index:1}
table.cat td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.cat tr.pickable{cursor:pointer}
table.cat tr.pickable:hover td{background:#e4eee9}
table.cat td.nm i{font-weight:700;color:var(--ink)}
.note{font-size:13px;color:var(--muted);padding:8px 16px;border-top:1px solid var(--line)}
.teacher{margin-top:10px;font-size:13px}
.teacher a{color:var(--muted)}
@media (max-width:640px){
  body{font-size:16px}
  .wrap{padding:12px}
  .card{padding:16px}
  h1{font-size:28px}
  .match{grid-template-columns:1fr}
  .bedrow{grid-template-columns:1fr}
  .basket-in{grid-template-columns:1fr}
  #cert .grid{grid-template-columns:1fr}
  #cert .big{font-size:44px}
}
@media print{
  body{background:#fff}
  #hud,.noprint,.modal{display:none !important}
  .card{box-shadow:none;margin:0}
  #cert{break-inside:avoid}
}
</style>
</head>
<body>
<header id="hud" hidden>
  <div class="wrap">
    <div class="co" id="hudName">Landscape Co.</div>
    <div class="stat">Cash <b id="hudCash">$500</b></div>
    <div class="stat">Reputation <span class="stars" id="hudStars">★★★☆☆</span></div>
    <div class="stat" id="hudRound">Job 1 of 6</div>
  </div>
  <div class="progress"><i id="hudProg"></i></div>
</header>
<main class="wrap" id="app"></main>

<div class="modal" id="catalog" hidden role="dialog" aria-modal="true" aria-labelledby="catTitle">
  <div class="box">
    <div class="head">
      <h3 id="catTitle">Plant Catalog: Bedding Plant Chart (Figure 25-5, pp. 293&ndash;296)</h3>
      <button class="btn ghost" style="color:#fff;border-color:#fff" id="catClose">Close</button>
    </div>
    <div class="tools">
      <input type="text" id="catSearch" placeholder="Search any word: shade, edible, blue, vine...">
      <select id="catUse">
        <option value="">All uses</option>
        <option>edging</option><option>flower bed</option><option>hanging basket</option>
        <option>cut flowers</option><option>window box</option><option>potted plant</option>
        <option>accent</option><option>urn</option><option>planter</option>
      </select>

      <table class="cat" id="catTable">
        <thead><tr><th>Name</th><th>Height</th><th>Spacing</th><th>Color</th><th>Uses</th><th>How to start</th><th>Remarks</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="note" id="catNote">Tip: the Remarks column holds most of the clues. Heights are in inches.</div>
  </div>
</div>

<script>
"use strict";
/* ============ SETTINGS (teacher can edit) ============ */
const TEACHER_PIN = "0545";          // PIN for the Teacher Check screen
const SALT = "NPHS-FFA-U25-TYCOON";  // change to make new completion codes
const START_CASH = 500;

/* ============ DATA: Figure 25-5 bedding plant chart ============ */
// [scientific, common, heightLo, heightHi, spacing, colors, uses, start, remarks]
const RAW = [
["Ageratum","floss flower",6,12,'6"–9"',"blue, pink, white","edging","seed and transplant","Compact, excellent bloom. Needs full sun."],
["Alternanthera","alternanthera",12,12,'12"',"a variety of colors","accent","seed","Creates a background for flowering plants."],
["Antirrhinum","snapdragon",12,36,'6"–8"',"yellow, pink, white, blue, red, salmon, rose, bronze, orange","cut flowers, flower bed","seed and transplant","Must be staked for straight flower spikes. Needs full sun. Excellent background plant."],
["Aster","aster",8,36,'10"–12"',"blue, red, salmon, pink, white, yellow","flower bed","seed and transplant","Excellent cut flowers."],
["Begonia","begonia",6,12,'6"–10"',"pink, red, white","edging, potted plant, window box, hanging basket","cuttings or seed","May be used as a houseplant. Needs direct light."],
["Browallia","browallia",12,18,'8"–10"',"blue, white","hanging basket, window box","cuttings or seed","Makes an attractive houseplant. Needs full sun."],
["Calendula","potted marigold",12,24,'10"–12"',"yellow, orange","flower bed, hanging basket","seed and transplant","Flower petals used in cooking stews to add color. Needs full sun."],
["Callistephus","China aster",12,24,'10"–12"',"blue, purple, white, yellow","flower bed, cut flowers","seed and transplant","Gives excellent summer color. Needs full sun."],
["Celosia","cockscomb",12,30,'10"–12"',"red, orange, yellow, pink","flower bed, cut flowers","seed and transplant","Excellent dried flower. Needs full sun."],
["Cleome speciosa","spider plant",24,36,'18"–36"',"pink, white","flower bed","seed directly","Makes an attractive houseplant."],
["Coleus","coleus",12,24,'10"–12"',"red, bronze, yellow, pink foliage","flower bed, hanging basket","seed and transplant","Needs full to partial sun. Beautiful foliage plant."],
["Coreopsis","coreopsis",12,24,'6"–10"',"yellow, red","flower bed","seed directly","Good for cut flowers."],
["Cosmos","cosmos",48,72,'12"–18"',"red, pink, yellow","flower bed","seed and transplant","Keep near the back of beds."],
["Dahlia variabilis","dahlia",12,24,'12"–15"',"red, pink, yellow, rose","flower bed, cut flowers","seed and transplant","Profuse bloomer. For maximum bloom, sow several weeks before other annuals."],
["Delphinium","larkspur",18,24,'8"–10"',"blue, pink, white","flower bed, cut flowers","seed and transplant","Grows best in peat pots. Difficult to transplant."],
["Dianthus","pink",6,18,'6"–8"',"white, pink","edging, cut flowers","cuttings or seed","Very fragrant flowers."],
["Dimorphotheca","cape marigold",12,18,'8"–18"',"yellow, orange, white","flower bed","seed and transplant","Grows well in dry areas."],
["Dolichos lablab","hyacinth bean",null,null,"","purple","accent","seed","Vine texture."],
["Gaillardia","gaillardia",12,24,'8"–10"',"red, orange","cut flowers, flower bed","cuttings","Loves seashore conditions. Does well in dry areas."],
["Gazania","treasure flower",6,10,'8"–10"',"orange, yellow, white, tangerine, bronze","flower bed","seed and transplant","Bright blooms."],
["Gomphrena","globe amaranth",9,24,'8"–10"',"blue, pink, white","cut flowers, flower bed","seed and transplant","Good dried flower. Collect and hang in a dry, dark place."],
["Gypsophila","baby's breath",12,18,'10"–12"',"pink, white","flower bed, cut flowers","seed directly","This is the annual form; there is also a perennial."],
["Helianthus","sunflower",18,60,'12"–36"',"yellow, brown","flower bed","seed directly","Seeds are edible."],
["Helichrysum","strawflower",24,36,'8"–10"',"yellow, red, white","flower bed","seed and transplant","Good dried flower. Cut and hang in a dry, dark place."],
["Hypoestes","polka-dot plant",8,24,'10"–12"',"burgundy, red, rose, white, pink","hanging basket, window box, flower bed","seed and transplant","Foliage accented by splashed colored leaves."],
["Iberis","candytuft",10,18,'6"–8"',"white, pink, red","edging","seed and transplant","Makes an attractive ground cover."],
["Impatiens","impatiens",6,18,'12"–18"',"pink, red, white, multicolor","edging, hanging basket","seed and transplant","Does best in a shaded area."],
["Ipomoea","morning glory",60,120,'10"–12"',"blue","trellis","seed directly","Vine."],
["Lantana","lantana",12,36,'2"–15"',"yellow, blue, red","hanging basket, flower bed, potted plant","cuttings","Makes an excellent topiary plant for the patio."],
["Lathyrus","sweet pea",36,60,'6"–10"',"pink, blue, white","cut flowers","seed directly","Grows best in cool conditions."],
["Limonium","statice (sea lavender)",18,30,'10"–12"',"blue, pink, white","flower bed, cut flowers","seed and transplant","Good dried flower. Filler flower for bouquets."],
["Lisianthus","lisianthus",6,24,'12"–14"',"blue, rose, orchid, white, pink, yellow","flower bed","seed and transplant","Large blooms, drought tolerant."],
["Lobelia","lobelia",3,6,'4"–6"',"blue, pink, white","edging, hanging basket, potted plant","seed directly","Very attractive in a hanging basket."],
["Lobularia","sweet alyssum",4,6,'4"–6"',"white, pink, blue","window box, edging, hanging basket","seed and transplant","Blooms all summer."],
["Matthiola","stock",12,36,'8"–10"',"white, pink, yellow, red","cut flowers, flower bed","seed and transplant","Fragrant flowers."],
["Mirabilis","four-o'clock",24,36,'10"–12"',"yellow, red, white","flower bed","seed and transplant","Withstands city conditions."],
["Myosotis","forget-me-not",6,12,'6"–8"',"blue, pink","edging, cut flowers","seed directly","Makes attractive cut flowers."],
["Nicotiana","flowering tobacco",18,24,'10"–12"',"rose, white","cut flowers, flower bed","seed and transplant","Fragrant flowers after dark."],
["Osteospermum","African daisy",15,15,'12"',"white, pastels, orange, red","accent, urn, flower bed","seed","Excellent flower quality."],
["Papaver","poppy",18,36,'10"–12"',"red, yellow, white","cut flowers, flower bed","seed directly","Grows in masses. Bright colors."],
["Pelargonium","geranium",12,18,'10"–12"',"red, white, pink, lavender","flower bed, window box, hanging basket","cuttings and seeds","Excellent flowering plant."],
["Pennisetum glaucum","millet",24,24,'24"',"bold metallic leaves, purple grassy leaves","urn, accent, flower bed","seed","12-inch cattail spikes."],
["Pentas","star flower",18,18,'18"–24"',"pink, white, red, pastel","flower bed, hanging basket, planter","seed","Flower color the full season."],
["Petunia","petunia",6,18,'10"–12"',"pink, red, white, blue","edging, flower bed, hanging basket","seed and transplant","Most widely used annual. Cultivars include 'Wave,' 'Magic Carpet,' 'Dazzle,' and 'Cascade.'"],
["Phlox","phlox",6,18,'6"–8"',"pink, blue, white, red","cut flowers, flower bed, window box, hanging basket","seed directly or transplant","Very intense colors."],
["Portulaca","rose moss",4,6,'3"–6"',"red, orange, yellow","edging, hanging basket","seed directly","Reseeds by itself."],
["Rudbeckia","black-eyed Susan",24,24,'24"',"yellow daisy, dark center","flower bed, accent","seed","'Indian Summer' and 'Sonora Marmalade' are cultivars."],
["Salpiglossis","giant velvet flower",18,36,'10"–12"',"gold, scarlet, rose, blue","flower bed, cut flowers","seed and transplant","Very small seed."],
["Salvia","scarlet sage",10,36,'6"–12"',"blue, red, white","cut flowers, flower bed","seed and transplant","Very showy color."],
["Scabiosa","pincushion flower",30,36,'12"–14"',"multicolor","cut flowers","seed and transplant","Many varieties to choose from."],
["Spilanthes","peek-a-boo",18,18,'24"',"yellow globe","flower bed, cut flowers, accent","seed","Companion crop to marigolds."],
["Tagetes","marigold",6,48,'6"–12"',"orange, yellow","flower bed, edging, potted plant, hanging basket","seed and transplant or seed directly","Wide range of varieties. No insect problems."],
["Thunbergia","black-eyed Susan vine",24,60,'10"–12"',"orange","climbing vine, hanging basket","seed and transplant","Nice addition to a summer or fall bouquet."],
["Tithonia","Mexican sunflower",24,30,'24"',"yellow, orange, red","flower bed, cut flowers","seed","Drought-resistant. Attracts butterflies. Mass flower for bouquets."],
["Tropaeolum","nasturtium",12,18,'10"–12"',"orange, yellow","flower bed, window box, hanging basket","seed and transplant or seed directly","Flowers and leaves are edible."],
["Verbena","verbena",6,12,'10"–12"',"purple, red, white","flower bed, edging","seed and transplant","Good rock garden plant."],
["Vinca","common periwinkle",8,12,'12"',"pink, pastel, white, blue, red, variegated colors","flower bed, urn, planter, edging and mounds","seed","Drought tolerant. Loves heat."],
["Viola","pansy",6,8,'6"–8"',"multicolor","edging, flower bed, cut flowers, hanging basket","seed and transplant","Gives excellent color in summer."],
["Zinnia","zinnia",8,36,'6"–12"',"multicolor","edging, flower bed, cut flowers","seed and transplant or seed directly","Gives excellent color in summer."]
];
const PLANTS = RAW.map(r => ({sci:r[0], common:r[1], lo:r[2], hi:r[3], sp:r[4], color:r[5], uses:r[6], start:r[7], rem:r[8],
  label: r[0] + " (" + r[1] + ")"}));
const P = s => PLANTS.find(p => p.sci === s);
const ht = p => p.hi == null ? "not listed" : (p.lo === p.hi ? p.hi + '"' : p.lo + '"–' + p.hi + '"');
const hasUse = (p,u) => p.uses.toLowerCase().includes(u);
const hasColor = (p,c) => { const t = p.color.toLowerCase(); return t.includes("multicolor") || t.split(/[^a-z]+/).includes(c); };

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const app = $("#app");
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (n < 0 ? "-$" : "$") + Math.abs(Math.round(n)).toLocaleString();
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
function toTop(){ window.scrollTo({top:0,behavior:"smooth"}); }

/* ============ state + scoring ============ */
const ROUNDS = [
  {key:"hire",  name:"Hiring Day",        topic:"Key terms"},
  {key:"calls", name:"Client Calls",      topic:"Bedding plant chart"},
  {key:"site",  name:"Job Site Prep",     topic:"Soil, fertilizer, mulch"},
  {key:"basket",name:"Basket Shop",       topic:"Hanging baskets"},
  {key:"design",name:"Bed Design",        topic:"Designing a bed"},
  {key:"season",name:"Season Calls",      topic:"Growing and care"}
];
let S = null;
function newState(name, period){
  const r = {}; ROUNDS.forEach(x => r[x.key] = {c:0,t:0});
  return {name, period, cash:START_CASH, r, round:0, started:Date.now()};
}
function score(key, ok, pay=50, cost=25){
  S.r[key].t++; if (ok){ S.r[key].c++; S.cash += pay; } else { S.cash -= cost; }
  hud();
}
function totals(){ let c=0,t=0; for (const k in S.r){ c+=S.r[k].c; t+=S.r[k].t; } return {c,t,pct: t? Math.round(100*c/t):0}; }
function starCount(pct){ return Math.max(1, Math.min(5, Math.round(pct/20))); }
function starStr(n){ return "★".repeat(n) + "☆".repeat(5-n); }
function hud(){
  $("#hud").hidden = false;
  $("#hudName").textContent = S.name.split(" ")[0] + "'s Landscape Co.";
  $("#hudCash").textContent = money(S.cash);
  const tt = totals();
  $("#hudStars").textContent = starStr(tt.t ? starCount(tt.pct) : 3);
  $("#hudRound").textContent = S.round < ROUNDS.length ? "Job " + (S.round+1) + " of " + ROUNDS.length : "Season complete";
  $("#hudProg").style.width = (100*S.round/ROUNDS.length) + "%";
}

/* ============ completion code ============ */
function fnv(str){ let h = 0x811c9dc5; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
const ALPH = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function makeCode(name, period, pct, date, mins){
  const norm = name.toLowerCase().replace(/[^a-z]/g,"") + "|" + String(period).toLowerCase().replace(/\s+/g,"") + "|" + pct + "|" + date + "|" + mins;
  let h1 = fnv(SALT + "|" + norm), h2 = fnv(norm + "|" + SALT), out = "";
  for (let i=0;i<6;i++){ const h = i<3 ? h1 : h2; out += ALPH[(h >>> (i%3*9)) % ALPH.length]; }
  return out.slice(0,3) + "-" + out.slice(3);
}
function today(d=new Date()){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }

function feedback(box, ok, title, body){
  box.className = "fb show " + (ok ? "good" : "bad");
  box.innerHTML = `<b class="t">${ok ? "✔ " : "✘ "}${esc(title)}</b>${body}`;

function nextBtn(label, fn){ const b = el(`<button class="btn green" style="margin-top:14px">${label}</button>`); b.onclick = fn; return b; }

function askMC(key, o, done){
  // o: {head, prompt, options:[...], answer: index into options, explain, pay?, cost?}
  const order = shuffle(o.options.map((t,i)=>({t,i})));
  const card = el(`<div class="card"><div class="kicker">${esc(o.head)}</div><h3>${o.prompt}</h3><div class="opts"></div><div class="fb"></div></div>`);
  const box = card.querySelector(".opts"), fb = card.querySelector(".fb");
  order.forEach(x => {
    const b = el(`<button class="opt">${esc(x.t)}</button>`);
    b.onclick = () => {
      const ok = x.i === o.answer;
      box.querySelectorAll("button").forEach((bb,k) => { bb.disabled = true; if (order[k].i === o.answer) bb.classList.add("right"); });
      if (!ok) b.classList.add("wrong");
      score(key, ok, o.pay, o.cost);
      feedback(fb, ok, ok ? "Correct! +" + money(o.pay||50) : "Not quite. " + money(-(o.cost||25)), `<div>${o.explain}</div>`);
      card.appendChild(nextBtn("Next", done));
    };
    box.appendChild(b);
  });
  app.innerHTML = ""; app.appendChild(card); toTop();
}
function askNum(key, o, done){
  // o: {head, prompt, answer, unit, explain}
  const card = el(`<div class="card"><div class="kicker">${esc(o.head)}</div><h3>${o.prompt}</h3>
    <div class="row" style="margin-top:10px"><input type="number" step="any" inputmode="decimal" style="max-width:180px" aria-label="Your answer"><span>${esc(o.unit||"")}</span><button class="btn">Submit</button></div><div class="fb"></div></div>`);
  const inp = card.querySelector("input"), btn = card.querySelector("button"), fb = card.querySelector(".fb");
  const go = () => {
    if (inp.value.trim() === "") { inp.focus(); return; }
    const v = parseFloat(inp.value), ok = Math.abs(v - o.answer) < 0.051;
    inp.disabled = true; btn.disabled = true;
    score(key, ok);
    feedback(fb, ok, ok ? "Correct! +$50" : "Not quite. The answer is " + o.answer + " " + (o.unit||"") + ". -$25", `<div>${o.explain}</div>`);
    card.appendChild(nextBtn("Next", done));
  };
  btn.onclick = go; inp.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  app.innerHTML = ""; app.appendChild(card); toTop(); inp.focus();
}
function series(items, done){ let i = 0; const step = () => i < items.length ? items[i++](step) : done(); step(); }

function hire(done){
  const TERMS = TERM_BANK.map(([t, ds]) => [t, pick(ds,1)[0]]);
  const terms = shuffle(TERMS), defs = shuffle(TERMS);
  const card = el(`<div class="card"><div class="kicker">Hiring Day</div><h3>Match each term to its meaning</h3><div class="match"><div class="col" id="tc"></div><div class="col" id="dc"></div></div><div class="fb"></div></div>`);
  app.innerHTML = ""; app.appendChild(card); toTop();
  const tc = card.querySelector("#tc"), dc = card.querySelector("#dc"), fb = card.querySelector(".fb");
  let sel = null, left = TERMS.length; const missed = new Set();
  terms.forEach(([t]) => { const b = el(`<button class="tile term">${esc(t)}</button>`); b.dataset.t = t; b.onclick = () => { if (b.classList.contains("done")) return; tc.querySelectorAll(".tile").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = b; }; tc.appendChild(b); });
  defs.forEach(([t,d]) => { const b = el(`<button class="tile">${esc(d)}</button>`); b.dataset.t = t; b.onclick = () => {
    if (!sel || b.classList.contains("done")) { if (!sel) { fb.className="fb show bad"; fb.innerHTML="Tap a term first, then its meaning."; } return; }
    const term = sel.dataset.t;
    if (term === t){
      sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done"); sel.disabled = true; b.disabled = true;
      const first = !missed.has(term);
      S.r.hire.t++; if (first){ S.r.hire.c++; S.cash += 25; } hud();
      fb.className = "fb show good"; fb.innerHTML = `<b class="t">✔ ${esc(term)}</b>${first ? "+$25" : "Matched (no pay after a miss)"}`;
      sel = null; left--;
      if (!left) card.appendChild(nextBtn("Finish hiring", done));
    } else {
      missed.add(term); S.cash -= 10; hud();
      b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
      fb.className = "fb show bad"; fb.innerHTML = `<b class="t">✘ Not a match</b>-$10. Try again.`;
    }
  }; dc.appendChild(b); });
}

  ["How should you mulch a new annual bed?","Apply 2 to 3 inches before planting",["Apply 6 inches after planting","Apply 1 inch only around each stem after planting","Skip mulch; annuals do not need it"],"Apply a 2- to 3-inch layer before the bed is planted. It spreads more evenly and saves time (p. 300)."],

function site(done){
  const L = pick([10,12,15,20,25,30],1)[0], W = pick([4,5,6,8,10],1)[0], area = L*W;
  const lbs = +(area/100*2).toFixed(2);
  const pH = pick([5.2,5.5,5.8,6.4,6.8,7.1],1)[0], lime = pH < 6 ? +(area/100*5).toFixed(2) : 0;
  const gal = pick([2,3,4,5],1)[0];
  const H = "Job Site Prep";
  const mc = pick(SITE_MC, 6).map(q => n => askMC("site", {head:H, prompt:q[0], options:[q[1], ...q[2]], answer:0, explain:q[3]}, n));
  const math = [
    n => askNum("site", {head:H, prompt:`The bed is <b>${L} ft by ${W} ft</b>. The book calls for 2 lb of 5-10-10 per 100 sq ft. How many pounds of 5-10-10 do you need?`, answer:lbs, unit:"lb", explain:`${L} × ${W} = ${area} sq ft. ${area} ÷ 100 × 2 = <b>${lbs} lb</b> of 5-10-10 (p. 298).`}, n),
    n => askNum("site", {head:H, prompt:`A soil test on that same ${area} sq ft bed shows a <b>pH of ${pH}</b>. If the pH is below 6.0, the book says to add 5 lb of ground limestone per 100 sq ft. How many pounds of limestone do you add? (Enter 0 if none.)`, answer:lime, unit:"lb", explain: pH < 6 ? `${pH} is below 6.0, so add limestone: ${area} ÷ 100 × 5 = <b>${lime} lb</b> (p. 298).` : `${pH} is not below 6.0, so you add <b>0 lb</b> of limestone (p. 298).`}, n),
    n => askNum("site", {head:H, prompt:`You are mixing soluble 20-20-20 fertilizer in a <b>${gal}-gallon</b> watering can. The rate is 1 tablespoon per gallon. How many tablespoons do you add?`, answer:gal, unit:"Tbsp", explain:`1 tablespoon per gallon × ${gal} gallons = <b>${gal} Tbsp</b>. Fertilizer in a solution is more readily available to plants (p. 300).`}, n)
  ];
  // the two bed questions stay together, in order; everything else is shuffled around them
  const steps = shuffle([...mc, math[2], "BED"]);
  const i = steps.indexOf("BED"); steps.splice(i, 1, math[0], math[1]);
  series(steps, done);
}

/* ============ Job 4: Basket Shop ============ */

  {who:"The county courthouse", colors:["red","white"], say:"Our bed runs along the front sidewalk. We want only red or white flowers."},

const ROWS = [

function design(done){
  series(pick(DESIGN_CLIENTS, 2).map((cl, i) => next => {
    const card = el(`<div class="card"><div class="kicker">Bed design ${i+1} of 2</div>

      <div class="bed">${ROWS.map(r => `<div class="bedrow" id="row-${r.key}"><div class="lab">${r.name}<span>tallest height ${r.rule}</span></div><div>${plantSelect("d-"+r.key)}</div><div class="checks"></div></div>`).join("")}</div>

      const dup = new Set(picks).size < picks.length;
      let rowsRight = 0;
      ROWS.forEach((r, k) => {
        const p = P(picks[k]);
        const hOK = r.test(p), cOK = cl.colors.some(c => hasColor(p,c)), uOK = hasUse(p,"flower bed") || hasUse(p,"edging"), sOK = !/shade/i.test(p.rem);
        const dOK = !dup || picks.indexOf(picks[k]) === k;
        const ok = hOK && cOK && uOK && sOK && dOK;
        if (ok) rowsRight++;
        score("design", ok);
        card.querySelector(`#row-${r.key} .checks`).innerHTML =
          `<span class="${hOK?'ok':'no'}">${hOK?'✔':'✘'} Height ${ht(p)}</span>` +
          `<span class="${cOK?'ok':'no'}">${cOK?'✔':'✘'} Color: ${esc(p.color)}</span>` +
          `<span class="${uOK?'ok':'no'}">${uOK?'✔':'✘'} Uses: ${esc(p.uses)}</span>` +
          (sOK ? "" : `<span class="no">✘ ${esc(p.rem)}</span>`) + (dOK ? "" : `<span class="no">✘ Already used in another row</span>`);
      });
      card.querySelectorAll("select,button").forEach(x => x.disabled = true);
      const stars = ["★☆☆","★☆☆","★★☆","★★★"][rowsRight];
      feedback(fb, rowsRight === 3, `${rowsRight} of 3 rows meet the plan. Client rating: ${stars}`,
        `<div>${rowsRight === 3 ? "Every row fits. Short plants in front keep every row visible from the sidewalk." : "Check the red marks. Use the tallest height in the chart to place each plant, and match the client's colors."}</div>`);
      card.appendChild(nextBtn("Next", next));
    };
  }), done);
}

function orderTask(title, list, done){
  const shuffled = shuffle(list.map((t,i)=>({t,i})));
  const card = el(`<div class="card"><div class="kicker">Season Calls</div><h3>${esc(title)}</h3><p class="small muted">Tap the steps in the order the textbook lists them. +$20 for each step, -$10 for each wrong tap.</p><div class="placed"></div><div class="order"></div><div class="fb"></div></div>`);
  app.innerHTML = ""; app.appendChild(card); toTop();
  const placed = card.querySelector(".placed"), box = card.querySelector(".order"), fb = card.querySelector(".fb");
  let nextIdx = 0, misses = 0;
  shuffled.forEach(x => {
    const b = el(`<button class="tile">${esc(x.t)}</button>`);
    b.onclick = () => {
      if (x.i === nextIdx){
        b.remove(); placed.appendChild(el(`<div><b>${nextIdx+1}.</b> ${esc(x.t)}</div>`)); nextIdx++;
        S.cash += 20; hud(); fb.className = "fb";
        if (nextIdx === list.length){
          const c = Math.max(0, list.length - misses);
          S.r.season.c += c; S.r.season.t += list.length; hud();
          feedback(fb, misses === 0, misses === 0 ? "All in order!" : `Done with ${misses} wrong tap${misses>1?"s":""}`, `<div>Score for this list: ${c} of ${list.length}.</div>`);
          card.appendChild(nextBtn("Next", done));
        }
      } else {
        misses++; S.cash -= 10; hud();
        b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
        feedback(fb, false, "Not next", `<div>Step ${nextIdx+1} comes before that one. -$10</div>`);
      }
    };
    box.appendChild(b);
  });
}
function season(done){
  series([
    n => orderTask("Put the 8 steps for growing flowering annuals in order (p. 298)", GROW8, n),
    n => orderTask("Put the 7 steps for caring for the plants in order (p. 303)", CARE7, n),
    ...pick(TROUBLE, 5).map((t, i) => n => askMC("season", {head:`Customer call ${i+1} of 5`, prompt:`&ldquo;${esc(t[0])}&rdquo; What do you tell them?`, options:[t[1], ...t[2]], answer:0, explain:t[3]}, n))
  ], done);
}
