const $=id=>document.getElementById(id), KEY='npffa_cde_code';
function b64(b){ const s=atob(b), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
async function open_(code,quiet){
  code=(code||'').trim().toUpperCase(); if(!code) return;
  if(!quiet){ $('err').textContent='Unlocking…'; $('go').disabled=true; }
  try{
    if(!window.crypto||!crypto.subtle) throw new Error('nocrypto');
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(LOCKED.salt),iterations:LOCKED.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(LOCKED.iv)},key,b64(LOCKED.data)));
    try{ if(quiet||$('rem').checked) sessionStorage.setItem(KEY,code); else sessionStorage.removeItem(KEY); }catch(e){}
    document.open(); document.write(plain); document.close();
  }catch(e){
    if(quiet){ try{sessionStorage.removeItem(KEY);}catch(_){} return; }
    $('go').disabled=false;
    $('err').textContent = e.message==='nocrypto' ? 'This browser can’t unlock the page. Try Chrome on a school Chromebook.' : 'That code didn’t work. Check with your advisor.';
  }
}
$('go').onclick=()=>open_($('pw').value); $('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') open_($('pw').value); });
try{ const c=sessionStorage.getItem(KEY); if(c) open_(c,true); }catch(e){}
})();
